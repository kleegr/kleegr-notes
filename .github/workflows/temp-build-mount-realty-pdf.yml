name: Temporary Build Mount Realty PDF

on:
  push:
    paths:
      - 'pdf-build-trigger.txt'
  pull_request:
    branches: [main]

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
      - name: Get source and build
        run: |
          git clone --depth 1 --branch generated/mount-realty-spec-final-2026-07-10 https://github.com/kleegr/kleegr-notes.git source-repo
          cd source-repo/artifacts
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mount-realty-kleegr-master-spec.tex')
          s = p.read_text()
          start = s.index('\\newcommand{\\callout}')
          end = s.index('\\newcommand{\\req}', start)
          replacement = '\\newcommand{\\callout}[2]{\\begin{quote}\\color{#1}\\small}\n\\newcommand{\\endcallout}{\\end{quote}}\n'
          p.write_text(s[:start] + replacement + s[end:])
          PY
          pdflatex -interaction=nonstopmode mount-realty-kleegr-master-spec.tex || true
          pdflatex -interaction=nonstopmode mount-realty-kleegr-master-spec.tex || true
          test -f mount-realty-kleegr-master-spec.pdf
          mv mount-realty-kleegr-master-spec.pdf Mount_Realty_Kleegr_Master_Project_Specification.pdf
      - name: Upload PDF and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mount_Realty_Kleegr_Master_Project_Specification
          path: |
            source-repo/artifacts/Mount_Realty_Kleegr_Master_Project_Specification.pdf
            source-repo/artifacts/mount-realty-kleegr-master-spec.log
          if-no-files-found: warn
